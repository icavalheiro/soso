services:
  soso:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Set a strong BOOTSTRAP_PASSWORD}
      Bootstrap__Name: ${BOOTSTRAP_NAME:-Administrator}
      AllowedHosts: "${DOMAIN:?Set DOMAIN};127.0.0.1;localhost"
      CloudflareTunnel: "true"
      TrustedProxy: ${TRUSTED_PROXY:-}
      Logging__LogLevel__Default: Warning
    ports:
      - "127.0.0.1:8060:8080"
    volumes:
      - soso-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
volumes:
  soso-data:
