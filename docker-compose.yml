services:
  soso:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Set a strong BOOTSTRAP_PASSWORD}
      Bootstrap__Name: ${BOOTSTRAP_NAME:-Administrator}
      AllowedHosts: "${DOMAIN:?Set DOMAIN};127.0.0.1;localhost"
      TrustedProxy: 172.30.50.2
      Logging__LogLevel__Default: Warning
    volumes:
      - soso-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    networks:
      backend:
        ipv4_address: 172.30.50.3
  nginx:
    image: nginx:stable-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      soso:
        condition: service_healthy
    ports:
      - "127.0.0.1:8060:8060"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      backend:
        ipv4_address: 172.30.50.2
networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.50.0/24
volumes:
  soso-data:
