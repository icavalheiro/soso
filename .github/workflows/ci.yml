name: Soso checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Soso.Web/package-lock.json
      - run: dotnet test tests/Soso.Api.Tests/Soso.Api.Tests.csproj --configuration Release
      - run: dotnet list src/Soso.Api/Soso.Api.csproj package --vulnerable --include-transitive
      - run: npm ci
        working-directory: src/Soso.Web
      - run: npm run build && npm run lint && npm audit --audit-level=moderate
        working-directory: src/Soso.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/Soso.Web
      - run: npx playwright test
        working-directory: src/Soso.Web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: src/Soso.Web/test-results
      - run: docker build -t soso:ci .
      - run: docker compose config --quiet
        env:
          DOMAIN: soso.example.test
          BOOTSTRAP_EMAIL: admin@example.test
          BOOTSTRAP_PASSWORD: configuration-validation-only
  publish:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
